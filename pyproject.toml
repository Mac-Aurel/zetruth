[project]
name = "zetruth"
version = "0.1.0"
description = "Vérification des affirmations factuelles des débats politiques à partir de sources officielles"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.14.0",
    "pydantic>=2.14.4",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Apostrophe typographique, courante dans les textes en français.
allowed-confusables = ["’"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
