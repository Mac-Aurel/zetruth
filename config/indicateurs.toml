# Catalogue des indicateurs les plus cités dans les débats.
#
# Chaque indicateur pointe vers une série d'une source de la liste blanche.
# Tous les identifiants ont été vérifiés sur l'API de la source.
#
# unite      : unité dans laquelle on compare aux affirmations
# facteur    : multiplicateur appliqué à la valeur de la source pour obtenir
#              cette unité (milliers vers millions : 0.001 ; -1 pour exprimer
#              un déficit en positif)
# unite_evolution : unité d'une hausse ou d'une baisse (« points » pour un taux)
# concurrents : autres indicateurs officiels qui mesurent la même chose avec
#              une autre définition. Ils sont récupérés en même temps : si leur
#              valeur diffère, le verdict est marqué à revoir.
#
# mots_cles  : expressions qui désignent l'indicateur dans une phrase (en minuscules)
# exclusions : expressions qui, présentes dans la phrase, écartent l'indicateur
# delai_publication_jours : pour une série dont l'historique ne remonte pas
#              assez loin, délai entre la fin d'une période et sa première
#              publication, pour savoir quelle période était la dernière connue
#              le jour d'un débat. Estimations tirées des calendriers habituels
#              de publication, à confirmer.
#
# Manque encore : le SMIC (pas trouvé dans la BDM de l'INSEE), le chômage et
# l'inflation en base actuelle (les séries ci-dessous couvrent les débats de
# 2017 à 2022).

# Emploi

[indicateurs.chomage_bit]
nom = "Taux de chômage au sens du BIT"
definition = "Part des chômeurs au sens du Bureau international du travail dans la population active, mesurée par l'enquête Emploi de l'INSEE."
source = "insee"
serie = "001688527"
unite = "%"
unite_evolution = "points"
perimetre = "France hors Mayotte"
frequence = "trimestrielle"
mots_cles = ["chômage", "chômeurs"]

[indicateurs.demandeurs_emploi_a]
nom = "Demandeurs d'emploi inscrits en catégorie A"
definition = "Inscrits à France Travail (ex-Pôle emploi), sans emploi, tenus de rechercher un emploi. Ce n'est pas le chômage au sens du BIT."
source = "insee"
serie = "010598384"
facteur = 0.001
unite = "millions"
unite_evolution = "millions"
perimetre = "France métropolitaine"
frequence = "trimestrielle"
mots_cles = ["catégorie a", "demandeurs d'emploi", "inscrits", "chômeurs"]
delai_publication_jours = 30
concurrents = ["demandeurs_emploi_abc"]

[indicateurs.demandeurs_emploi_abc]
nom = "Demandeurs d'emploi inscrits en catégories A, B et C"
definition = "Inscrits à France Travail tenus de rechercher un emploi, y compris ceux qui ont exercé une activité réduite (catégories B et C) : une partie d'entre eux travaille."
source = "insee"
serie = "010598455"
facteur = 0.001
unite = "millions"
unite_evolution = "millions"
perimetre = "France métropolitaine"
frequence = "trimestrielle"
mots_cles = ["a, b, c", "a, b et c", "catégories a", "demandeurs d'emploi", "inscrits", "chômeurs"]
delai_publication_jours = 30
concurrents = ["demandeurs_emploi_a"]

# Prix

[indicateurs.inflation_ipc]
nom = "Inflation (indice des prix à la consommation)"
definition = "Glissement annuel de l'indice des prix à la consommation de l'INSEE, ensemble des ménages (base 2015, série arrêtée)."
source = "insee"
serie = "001761313"
unite = "%"
unite_evolution = "points"
perimetre = "France"
frequence = "mensuelle"
mots_cles = ["inflation", "hausse des prix", "prix à la consommation"]
concurrents = ["inflation_ipch"]

[indicateurs.inflation_ipch]
nom = "Inflation (indice des prix à la consommation harmonisé)"
definition = "Taux de variation annuel de l'indice harmonisé, calculé selon la méthode commune européenne. Diffère de l'IPC, notamment par le traitement de la santé."
source = "eurostat"
dataset = "prc_hicp_manr"
filtres = { coicop = "CP00", unit = "RCH_A", freq = "M", geo = "FR" }
unite = "%"
unite_evolution = "points"
perimetre = "France"
frequence = "mensuelle"
mots_cles = ["inflation", "hausse des prix", "prix à la consommation harmonisé"]
delai_publication_jours = 20
# Estimation rapide pour les pays de la zone euro, publiée dès le début du mois suivant.
delai_publication_jours_zone_euro = 3
concurrents = ["inflation_ipc"]

