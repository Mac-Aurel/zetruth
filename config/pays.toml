# Pays reconnus dans les comparaisons internationales.
#
# code : code géographique Eurostat
# mots : façons de désigner le pays dans une phrase (en minuscules)
# zone_euro_depuis : date d'entrée dans la zone euro. Pour l'inflation, les
#   pays de la zone euro ont une estimation rapide publiée dès le début du mois
#   suivant (communiqué Eurostat du 1er avril 2022 par exemple) ; les autres
#   attendent la publication complète, environ trois semaines plus tard.

[pays.DE]
nom = "Allemagne"
mots = ["allemagne"]
zone_euro_depuis = 1999-01-01

