# Liste blanche des sources officielles.
#
# Seules ces sources peuvent fonder un verdict. Une URL est acceptée si elle
# commence par l'un des préfixes déclarés (le « www. » est ignoré).
#
# portee = "preuve" (par défaut) : la source peut fonder un verdict sur un fait.
# portee = "attribution" : la source ne peut servir qu'à vérifier ce qu'elle a
# elle-même publié (« un sondage Odoxa dit 75 % »), jamais le fait lui-même.
# Un sondage mesure une opinion, pas une réalité.
#
# statut = "a_verifier" tant que l'accès (API, fichier, site), la
# documentation et les conditions d'usage n'ont pas été lus dans la doc
# officielle. Une fois fait, passer à "verifiee" et remplir acces,
# documentation, conditions_usage et date_verification.
#
# Ajouter une source : la justifier dans la PR.

# Statistiques économiques et sociales

[sources.insee]
nom = "Institut national de la statistique et des études économiques"
urls = ["https://insee.fr/", "https://api.insee.fr/"]
domaines = ["economie", "emploi", "social", "demographie"]
statut = "a_verifier"

[sources.dares]
nom = "Direction de l'animation de la recherche, des études et des statistiques"
urls = ["https://dares.travail-emploi.gouv.fr/"]
domaines = ["emploi", "social"]
statut = "a_verifier"

[sources.drees]
nom = "Direction de la recherche, des études, de l'évaluation et des statistiques"
urls = ["https://drees.solidarites-sante.gouv.fr/"]
domaines = ["social", "sante"]
statut = "a_verifier"

[sources.france_travail]
nom = "France Travail"
urls = ["https://francetravail.fr/", "https://francetravail.org/"]
domaines = ["emploi"]
statut = "a_verifier"

